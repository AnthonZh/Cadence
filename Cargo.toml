[package]
name = "cadence"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Desktop marching band drill design and rehearsal planning"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/AnthonZh/Cadence"
keywords = ["marching-band", "drill", "desktop", "egui"]
categories = ["gui", "multimedia"]
publish = false

[profile.release]
lto = "thin"
strip = true

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
tiny-skia = "=0.11.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
ab_glyph = "=0.2.31"
