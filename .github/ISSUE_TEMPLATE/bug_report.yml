name: Bug report
description: Report an application defect.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Application version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Windows 11 x64, Ubuntu 22.04 x64, or macOS 15 Apple Silicon
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal project or screenshots when relevant. Remove private data and audio before uploading.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
